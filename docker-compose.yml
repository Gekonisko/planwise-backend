services:
  planwise.api:
    image: ${DOCKER_REGISTRY-}planwiseapi
    container_name: PlanWise.Api
    build:
      context: .
      dockerfile: src/API/PlanWise.API/Dockerfile
    depends_on:
      planwise.database:
        condition: service_healthy
    ports:
        - 5000:8080
        - 5001:8081

  planwise.database:
    image: postgres:latest
    container_name: PlanWise.Database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planwise
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
