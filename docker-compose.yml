services:
  planwise.api:
    image: ${DOCKER_REGISTRY-}planwiseapi
    container_name: PlanWise.Api
    build:
      context: .
      dockerfile: PlanWise/Dockerfile
    ports:
        - 5000:8080
        - 5001:8081 

  planwise.database:
    image: postgres:latest
    container_name: PlanWise.Database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planwise
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - 5432:5432
